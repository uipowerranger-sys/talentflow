databases:
  - name: talentflow-db
    databaseName: talentflow
    user: talentflow
    region: singapore

services:
  - type: keyvalue
    name: talentflow-redis
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: talentflow-api
    runtime: python
    rootDir: talentflow-fullstack/backend
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m scripts.bootstrap_admin && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: talentflow-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: TalentFlow Administrator
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        fromService:
          name: talentflow-redis
          type: keyvalue
          property: connectionString
      - key: AZURE_STORAGE_CONNECTION_STRING
        sync: false
      - key: AZURE_RESUME_CONTAINER
        value: resumes

  - type: worker
    name: talentflow-resume-worker
    runtime: python
    rootDir: talentflow-fullstack/backend
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: rq worker talentflow-resumes
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: talentflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: talentflow-redis
          type: keyvalue
          property: connectionString
      - key: AZURE_STORAGE_CONNECTION_STRING
        fromService:
          name: talentflow-api
          type: web
          envVarKey: AZURE_STORAGE_CONNECTION_STRING
      - key: AZURE_RESUME_CONTAINER
        value: resumes

  - type: web
    name: talentflow-frontend
    runtime: static
    rootDir: talentflow-fullstack/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
