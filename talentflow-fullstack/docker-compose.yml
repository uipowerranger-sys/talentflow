services:
  api:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://talentflow:talentflow@db:5432/talentflow
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only-change-before-deploying}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      RESUME_STORAGE_DIR: /app/var/resumes
      REDIS_URL: redis://redis:6379/0
    volumes:
      - resumes:/app/var/resumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talentflow
      POSTGRES_USER: talentflow
      POSTGRES_PASSWORD: talentflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentflow -d talentflow"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    command: ["rq", "worker", "talentflow-resumes"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://talentflow:talentflow@db:5432/talentflow
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only-change-before-deploying}
      RESUME_STORAGE_DIR: /app/var/resumes
      REDIS_URL: redis://redis:6379/0
    volumes:
      - resumes:/app/var/resumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  resumes:
