name: Deploy TalentFlow to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: talentflow-fullstack/frontend/package-lock.json
      - run: npm ci
        working-directory: talentflow-fullstack/frontend
      - run: npm run build -- --base=/talentflow/
        working-directory: talentflow-fullstack/frontend
      - run: cp talentflow-fullstack/frontend/dist/index.html talentflow-fullstack/frontend/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: talentflow-fullstack/frontend/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
